1|name: Check Upstream and Build
2|
3|on:
4|  push:
5|    branches: [main]
6|  schedule:
7|    - cron: '0 * * * *'
8|  workflow_dispatch:
9|
10|permissions:
11|  contents: write
12|  packages: write
13|  actions: write
14|
15|jobs:
16|  check:
17|    runs-on: ubuntu-latest
18|    timeout-minutes: 10
19|    outputs:
20|      upstream_sha: ${{ steps.upstream.outputs.sha }}
21|      has_new: ${{ steps.compare.outputs.has_new }}
22|      upstream_tag: ${{ steps.upstream_tag.outputs.tag }}
23|      upstream_tag_sha: ${{ steps.upstream_tag.outputs.sha }}
24|      has_new_tag: ${{ steps.compare_tag.outputs.has_new_tag }}
25|    steps:
26|      - name: Checkout
27|        uses: actions/checkout@v4
28|        with:
29|          fetch-depth: 1
30|
31|      - name: Get upstream latest commit
32|        id: upstream
33|        run: |
34|          UPSTREAM_SHA=$(curl -sL \
35|            -H "Authorization: Bearer *** secrets.GITHUB_TOKEN }}" \
36|            -H "Accept: application/vnd.github+json" \
37|            https://api.github.com/repos/NousResearch/hermes-agent/commits/main \
38|            | jq -r '.sha // empty')
39|          echo "sha=$UPSTREAM_SHA" >> "$GITHUB_OUTPUT"
40|          echo "Upstream SHA: $UPSTREAM_SHA"
41|
42|      - name: Get last known SHA
43|        id: cached
44|        run: |
45|          if [ -f .upstream-sha ]; then
46|            LAST_SHA=$(cat .upstream-sha)
47|            echo "sha=$LAST_SHA" >> "$GITHUB_OUTPUT"
48|            echo "Last known SHA: $LAST_SHA"
49|          else
50|            echo "sha=" >> "$GITHUB_OUTPUT"
51|            echo "No cached SHA found"
52|          fi
53|
54|      - name: Compare and update
55|        id: compare
56|        run: |
57|          if [ "${{ steps.upstream.outputs.sha }}" != "${{ steps.cached.outputs.sha }}" ] && \
58|             [ -n "${{ steps.upstream.outputs.sha }}" ]; then
59|            echo "has_new=true" >> "$GITHUB_OUTPUT"
60|            echo "${{ steps.upstream.outputs.sha }}" > .upstream-sha
61|            echo "New commit detected: ${{ steps.upstream.outputs.sha }}"
62|          else
63|            echo "has_new=false" >> "$GITHUB_OUTPUT"
64|            echo "No new commits"
65|          fi
66|
67|      - name: Get upstream latest tag
68|        id: upstream_tag
69|        run: |
70|          TAG_INFO=$(curl -sL \
71|            -H "Authorization: Bearer *** secrets.GITHUB_TOKEN }}" \
72|            -H "Accept: application/vnd.github+json" \
73|            "https://api.github.com/repos/NousResearch/hermes-agent/tags?per_page=1")
74|          LATEST_TAG=$(echo "$TAG_INFO" | jq -r '.[0].name // empty')
75|          TAG_SHA=$(echo "$TAG_INFO" | jq -r '.[0].commit.sha // empty')
76|          echo "tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"
77|          echo "sha=$TAG_SHA" >> "$GITHUB_OUTPUT"
78|          echo "Latest upstream tag: $LATEST_TAG (sha: $TAG_SHA)"
79|
80|      - name: Get last known tag
81|        id: cached_tag
82|        run: |
83|          if [ -f .upstream-tag ]; then
84|            LAST_TAG=$(cat .upstream-tag)
85|            echo "tag=$LAST_TAG" >> "$GITHUB_OUTPUT"
86|            echo "Last known tag: $LAST_TAG"
87|          else
88|            echo "tag=" >> "$GITHUB_OUTPUT"
89|            echo "No cached tag found"
90|          fi
91|
92|      - name: Compare tag
93|        id: compare_tag
94|        run: |
95|          if [ -n "${{ steps.upstream_tag.outputs.tag }}" ] && \
96|             [ "${{ steps.upstream_tag.outputs.tag }}" != "${{ steps.cached_tag.outputs.tag }}" ]; then
97|            echo "has_new_tag=true" >> "$GITHUB_OUTPUT"
98|            echo "${{ steps.upstream_tag.outputs.tag }}" > .upstream-tag
99|            echo "New tag detected: ${{ steps.upstream_tag.outputs.tag }}"
100|          else
101|            echo "has_new_tag=false" >> "$GITHUB_OUTPUT"
102|            echo "No new tags"
103|          fi
104|
105|      - name: Commit updated SHA
106|        if: steps.compare.outputs.has_new == 'true'
107|        run: |
108|          git config user.name "github-actions[bot]"
109|          git config user.email "github-actions[bot]@users.noreply.github.com"
110|          git add .upstream-sha
111|          git commit -m "chore: update upstream SHA to ${{ steps.upstream.outputs.sha }}"
112|          git push
113|
114|      - name: Commit updated tag
115|        if: steps.compare_tag.outputs.has_new_tag == 'true'
116|        run: |
117|          git config user.name "github-actions[bot]"
118|          git config user.email "github-actions[bot]@users.noreply.github.com"
119|          git add .upstream-tag
120|          git commit -m "chore: update upstream tag to ${{ steps.upstream_tag.outputs.tag }}"
121|          git push
122|
123|  build:
124|    needs: check
125|    if: needs.check.outputs.has_new == 'true' || needs.check.outputs.has_new_tag == 'true'
126|    runs-on: ubuntu-latest
127|    timeout-minutes: 90
128|    steps:
129|      - name: Checkout
130|        uses: actions/checkout@v4
131|
132|      - name: Set up Docker Buildx
133|        uses: docker/setup-buildx-action@v3
134|
135|      - name: Generate version tags
136|        id: tags
137|        run: |
138|          {
139|            echo "ghcr.io/jiqfu/hermes-root-build:latest"
140|            echo "ghcr.io/jiqfu/hermes-root-build:$(date -u +%Y%m%d)"
141|            if [ -n "${{ needs.check.outputs.upstream_tag }}" ]; then
142|              echo "ghcr.io/jiqfu/hermes-root-build:${{ needs.check.outputs.upstream_tag }}"
143|            fi
144|          } > /tmp/tags.txt
145|          echo "list<<EOF" >> "$GITHUB_OUTPUT"
146|          cat /tmp/tags.txt >> "$GITHUB_OUTPUT"
147|          echo "EOF" >> "$GITHUB_OUTPUT"
148|
149|      - name: Log in to GitHub Container Registry
150|        uses: docker/login-action@v3
151|        with:
152|          registry: ghcr.io
153|          username: ${{ github.actor }}
154|          password: ${{ secrets.GITHUB_TOKEN }}
155|
156|      - name: Build and push
157|        uses: docker/build-push-action@v6
158|        with:
159|          context: .
160|          file: Dockerfile
161|          push: true
162|          platforms: linux/amd64
163|          tags: ${{ steps.tags.outputs.list }}
164|          build-args: |
165|            UPSTREAM_SHA=${{ needs.check.outputs.upstream_tag_sha || needs.check.outputs.upstream_sha }}
166|          cache-from: type=gha
167|          cache-to: type=gha,mode=max
168|
169|      - name: Cleanup old daily tags (keep last 30 days)
170|        shell: bash
171|        run: |
172|          CUTOFF=$(date -u -d '30 days ago' +%s)
173|          echo "Cleaning up YYYYMMDD tags older than $(date -u -d @$CUTOFF '+%Y-%m-%d')"
174|          gh api "/user/packages/container/hermes-root-build/versions?per_page=100" \
175|            --jq '.[] | {id: .id, tags: .metadata.container.tags, created: .created_at}' \
176|            | jq -c '.' | while read -r ver; do
177|              CREATED=$(echo "$ver" | jq -r '.created')
178|              CREATED_TS=$(date -u -d "$CREATED" +%s)
179|              if [ "$CREATED_TS" -lt "$CUTOFF" ]; then
180|                TAGS=$(echo "$ver" | jq -r '.tags[]' 2>/dev/null)
181|                for tag in $TAGS; do
182|                  if [[ "$tag" =~ ^[0-9]{8}$ ]]; then
183|                    ID=$(echo "$ver" | jq -r '.id')
184|                    echo "  Delete: id=$ID tags=$(echo "$ver" | jq -rc '.tags') created=$CREATED"
185|                    gh api -X DELETE "/user/packages/container/hermes-root-build/versions/$ID" --silent
186|                    break
187|                  fi
188|                done
189|              fi
190|            done
191|          echo "Cleanup done"
192|        env:
193|          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
